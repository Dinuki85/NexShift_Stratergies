#PlanetScale Secure JDBC URL

spring.datasource.url=jdbc:mysql://localhost:3306/db name?useSSL=false
spring.datasource.username=database usernam
spring.datasource.password=database password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Optional Email Sending (if needed)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=company@gmail.com   
spring.mail.password=google app passowrd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# application.properties





